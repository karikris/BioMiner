[project]
name = "biominer"
version = "0.1.0"
description = "Flickr Lepidoptera image triage pipeline with BioCLIP visual evidence."
requires-python = ">=3.14.7"
dependencies = [
  "anyio>=4.15.1,<5",
  "duckdb>=1.5.6",
  "httpcore>=1.0.9,<1.1",
  "httpx>=0.28.1,<1",
  "lxml>=6.1.3",
  "matplotlib>=3.11.2",
  "pillow>=13.0.0",
  "polars>=2.0.0,<3",
  "pyarrow>=25.0.1",
  "pydantic>=2.14.1",
  "python-pptx>=1.0.2",
]

[project.optional-dependencies]
geo = [
    "h3>=4.5,<5",
]
ml = [
    "numpy>=2.5.4,<3",
    "scikit-learn>=1.9.1,<2",
    "skops>=0.16,<0.17",
]
postgres = [
    "psycopg[c]>=3.3.6",
]
test = [
    "h3>=4.5,<5",
    "pytest>=9.1.1",
]

[project.scripts]
biominer = "biominer.polars_runtime:cli_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biominer.registry" = ["language_code_metadata.json"]
