[project]
name = "biominer"
version = "0.1.0"
description = "Flickr Lepidoptera image triage pipeline with BioCLIP visual evidence."
requires-python = ">=3.14"
dependencies = [
  "duckdb>=1.2",
  "httpcore>=1.0.9,<1.1",
  "httpx>=0.28,<1",
  "pillow>=12",
  "polars>=1.30",
  "pyarrow>=18",
  "pydantic>=2.10",
]

[project.optional-dependencies]
geo = [
    "h3>=4.5,<5",
]
ml = [
    "numpy>=2.4,<3",
    "scikit-learn>=1.9,<2",
    "skops>=0.14,<0.15",
]
postgres = [
    "psycopg[binary]>=3.2",
]
test = [
    "h3>=4.5,<5",
    "matplotlib>=3.10",
    "pytest>=8",
]

[project.scripts]
biominer = "biominer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biominer.registry" = ["language_code_metadata.json"]
