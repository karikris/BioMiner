[project]
name = "biominer"
version = "0.1.0"
description = "Flickr Lepidoptera image triage pipeline with BioCLIP visual evidence."
requires-python = ">=3.14"
dependencies = [
  "duckdb>=1.2",
  "httpx>=0.28",
  "polars>=1.30",
  "pyarrow>=18",
  "pydantic>=2.10",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
test = [
    "matplotlib>=3.10",
    "pytest>=8",
]

[project.scripts]
biominer = "biominer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
